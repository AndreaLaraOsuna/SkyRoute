<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/base :: head('Vuelos')}"></head>

<body>

<section class="hero hero-corto">
    <th:block th:with="urlRegresar=@{/inicio}">
        <header th:replace="~{fragments/base :: header('inicio')}"></header>
    </th:block>

    <div class="hero-contenido">
        <h1 class="hero-titulo"
            th:text="${origen != null and destino != null ? origen + ' - ' + destino : 'Vuelos disponibles'}">
            Vuelos disponibles
        </h1>
        <p class="hero-detalle" th:if="${fechaIda != null}"
           th:text="${#temporals.format(fechaIda, 'dd MMM yyyy')}"></p>
    </div>
</section>

<main>
    <section class="contenedor seccion-vuelos">
        <div class="encabezado-seccion">
            <h2>Vuelos disponibles</h2>
            <p th:if="${#lists.isEmpty(vuelos)}">No hay vuelos disponibles para los criterios seleccionados.</p>
            <p th:unless="${#lists.isEmpty(vuelos)}">Selecciona el vuelo que mejor se adapte a tu viaje</p>
        </div>

        <div class="lista-vuelos">
            <article class="tarjeta-vuelo" th:each="vuelo : ${vuelos}">
                    <span class="logo-skyroute">
                        <img th:src="@{/imgs/iconos/avion.svg}" alt="" class="icono">SKYROUTE
                    </span>
                <div class="vuelo-itinerario">
                    <div class="vuelo-punto">
                        <span class="vuelo-hora" th:text="${#temporals.format(vuelo.horaSalida, 'HH:mm')}">8:15</span>
                        <span class="vuelo-codigo" th:text="${#strings.substring(vuelo.ruta.origen, 0, 3).toUpperCase()}">OBR</span>
                        <span class="vuelo-ciudad" th:text="${vuelo.ruta.origen}">Ciudad Obregón</span>
                    </div>
                    <div class="vuelo-duracion">
                        <span th:text="${(vuelo.ruta.duracionMinutos / 60) + ' h' + (vuelo.ruta.duracionMinutos % 60 > 0 ? ' ' + (vuelo.ruta.duracionMinutos % 60) + ' min' : '')}">1 h</span>
                        <span class="vuelo-linea"></span>
                    </div>
                    <div class="vuelo-punto">
                        <span class="vuelo-hora" th:text="${#temporals.format(vuelo.horaSalida.plusMinutes(vuelo.ruta.duracionMinutos), 'HH:mm')}">9:15</span>
                        <span class="vuelo-codigo" th:text="${#strings.substring(vuelo.ruta.destino, 0, 3).toUpperCase()}">GVE</span>
                        <span class="vuelo-ciudad" th:text="${vuelo.ruta.destino}">Guasave</span>
                    </div>
                </div>
                <div class="vuelo-precio">
                    <span class="vuelo-monto" th:text="'$' + ${#numbers.formatDecimal(vuelo.ruta.tarifa, 1, 'COMMA', 0, 'POINT')} + ' MXN'">$1,560 MXN</span>
                    <a th:href="@{/reservar(vueloId=${vuelo.id})}" class="boton boton-secundario boton-mini">Reservar</a>
                </div>
            </article>
        </div>
    </section>
</main>

<th:block th:replace="~{fragments/base :: sidebar('inicio')}"></th:block>
<footer th:replace="~{fragments/base :: footer}"></footer>

</body>
</html>
