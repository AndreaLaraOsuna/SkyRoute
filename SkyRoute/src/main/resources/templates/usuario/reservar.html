<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/base :: head('Datos del pasajero')}"></head>

<body>

<section class="hero hero-con-resumen">
    <th:block th:with="urlRegresar=@{/vuelos}">
        <header th:replace="~{fragments/base :: header('inicio')}"></header>
    </th:block>

    <div class="hero-contenido">
        <h1 class="hero-titulo">Datos del pasajero</h1>
        <p class="hero-subtitulo"
           th:if="${vuelo != null}"
           th:text="'Vuelo ' + ${vuelo.ruta.codigo} + ' · ' + ${vuelo.ruta.origen} + ' - ' + ${vuelo.ruta.destino}">
            Completa los datos para continuar
        </p>
    </div>
</section>

<main>
    <form class="contenedor contenedor-estrecho formulario-reserva" th:action="@{/asientos}" method="POST">

        <section class="tarjeta bloque-formulario"
                 th:each="i : ${#numbers.sequence(1, pasajeros != null ? pasajeros : 1)}">
            <h3 th:if="${pasajeros != null and pasajeros > 1}"
                th:text="'Pasajero ' + ${i}"
                style="margin-bottom: 1rem;">Pasajero 1</h3>

            <div class="grupo-campo">
                <label class="etiqueta" th:for="'pasajero-nombre-' + ${i}">Nombre completo</label>
                <input type="text" class="campo campo-azul" th:id="'pasajero-nombre-' + ${i}"
                       name="nombresCompletos"
                       th:value="${i == 1 and cliente != null ? cliente.nombreCompleto : ''}" required>
            </div>

            <div class="fila-campos">
                <div class="grupo-campo">
                    <label class="etiqueta" th:for="'pasajero-nacimiento-' + ${i}">Fecha de nacimiento</label>
                    <input type="date" class="campo campo-azul" th:id="'pasajero-nacimiento-' + ${i}"
                           name="fechasNacimiento" required>
                </div>

                <div class="grupo-campo">
                    <label class="etiqueta" th:for="'pasajero-nacionalidad-' + ${i}">Nacionalidad</label>
                    <input type="text" class="campo campo-azul" th:id="'pasajero-nacionalidad-' + ${i}"
                           name="nacionalidades" value="Mexicana" required>
                </div>
            </div>

            <div class="fila-campos" th:if="${i == 1 and cliente != null}">
                <div class="grupo-campo">
                    <label class="etiqueta" for="pasajero-correo">Correo electrónico</label>
                    <input type="email" class="campo campo-azul" id="pasajero-correo"
                           th:value="${cliente.correo}" readonly>
                </div>

                <div class="grupo-campo" th:if="${cliente instanceof T(com.cisneros_guevara_lara.SkyRoute.model.Cliente)}">
                    <label class="etiqueta" for="pasajero-telefono">Teléfono</label>
                    <input type="tel" class="campo campo-azul" id="pasajero-telefono"
                           th:value="${cliente.telefono}" readonly>
                </div>
            </div>
        </section>

        <button type="submit" class="boton boton-secundario boton-grande boton-bloque">Continuar a selección de asientos</button>
    </form>
</main>

<th:block th:replace="~{fragments/base :: sidebar('inicio')}"></th:block>
<footer th:replace="~{fragments/base :: footer}"></footer>

</body>
</html>
