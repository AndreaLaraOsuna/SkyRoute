<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/base :: head('Pago')}"></head>

<body>

<section class="hero hero-con-resumen">
    <th:block th:with="urlRegresar=@{/asientos}">
        <header th:replace="~{fragments/base :: header('inicio')}"></header>
    </th:block>

    <div class="hero-contenido">
        <h1 class="hero-titulo">Pago</h1>
        <p class="hero-subtitulo">Selecciona tu método de pago y completa los datos</p>
    </div>
</section>

<main>
    <form class="contenedor contenedor-estrecho formulario-reserva" th:action="@{/confirmar-reserva}" method="POST">
        <div class="metodos-pago">
            <label class="metodo-pago">
                <input type="radio" name="metodoPago" value="TARJETA" class="selector-oculto" checked>
                <img th:src="@{/imgs/iconos/tarjeta.svg}" alt="">
                Tarjeta
            </label>
            <label class="metodo-pago">
                <input type="radio" name="metodoPago" value="PAYPAL" class="selector-oculto">
                <img th:src="@{/imgs/iconos/paypal.svg}" alt="">
                PayPal
            </label>
            <label class="metodo-pago">
                <input type="radio" name="metodoPago" value="APPLE_PAY" class="selector-oculto">
                <img th:src="@{/imgs/iconos/apple-pay.svg}" alt="">
                Apple Pay
            </label>
        </div>

        <section class="tarjeta bloque-formulario">
            <div class="grupo-campo">
                <label class="etiqueta" for="pago-numero">Número de tarjeta</label>
                <input type="text" class="campo campo-azul" id="pago-numero" name="numeroTarjeta" placeholder="1234 5678 9012 3456" inputmode="numeric" maxlength="19">
            </div>
            <div class="fila-campos">
                <div class="grupo-campo">
                    <label class="etiqueta" for="pago-vencimiento">Fecha de vencimiento</label>
                    <input type="text" class="campo campo-azul" id="pago-vencimiento" name="vencimiento" placeholder="MM / AAAA">
                </div>
                <div class="grupo-campo">
                    <label class="etiqueta" for="pago-cvv">CVV</label>
                    <div class="campo-con-icono">
                        <input type="password" id="pago-cvv" name="cvv" placeholder="123" maxlength="4">
                        <img th:src="@{/imgs/iconos/ojo.svg}" alt="" class="icono">
                    </div>
                </div>
            </div>
            <div class="grupo-campo">
                <label class="etiqueta" for="pago-titular">Nombre del titular</label>
                <input type="text" class="campo campo-azul" id="pago-titular" name="titular"
                       th:value="${#authentication != null and #authentication.name != 'anonymousUser' ? #authentication.name : ''}"
                       placeholder="Nombre del titular">
            </div>
        </section>

        <div class="acciones-reserva">
            <label class="casilla-terminos">
                <input type="checkbox" name="aceptaTerminos" checked required>
                <span>He leído y acepto los <em><strong>términos y condiciones</strong></em></span>
            </label>
            <button type="button" class="boton boton-secundario boton-grande boton-bloque" data-abrir-modal="modal-reserva-confirmada">Confirmar reservación</button>
        </div>
    </form>
</main>

<div class="modal-fondo modal-fondo-difuminado" id="modal-reserva-confirmada" role="dialog" aria-modal="true">
    <div class="modal modal-centrado">
        <img th:src="@{/imgs/iconos/exito.svg}" alt="" class="modal-icono">
        <h2 class="modal-titulo">Reserva confirmada</h2>
        <p class="modal-texto">Puedes consultar tus reservas en "Mis Reservas" desde el menú</p>
        <a th:href="@{/mis-reservas}" class="boton boton-secundario boton-grande boton-bloque">Volver</a>
    </div>
</div>

<th:block th:replace="~{fragments/base :: sidebar('inicio')}"></th:block>
<footer th:replace="~{fragments/base :: footer}"></footer>

<script th:src="@{/js/script.js}"></script>
</body>
</html>
