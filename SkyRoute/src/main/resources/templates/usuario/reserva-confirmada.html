<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/base :: head('Reserva confirmada')}"></head>

<body>

<section class="hero hero-con-resumen">
    <header th:replace="~{fragments/base :: header('inicio')}"></header>
    <div class="hero-contenido">
        <h1 class="hero-titulo">Reservación</h1>
    </div>
</section>

<div class="modal-fondo modal-fondo-difuminado visible" role="dialog" aria-modal="true">
    <div class="modal modal-centrado">
        <img th:src="@{/imgs/iconos/exito.svg}" alt="" class="modal-icono">
        <h2 class="modal-titulo">Reserva confirmada</h2>
        <p class="modal-texto" th:if="${folio != null}" th:text="'Folio: ' + ${folio}">Folio</p>

        <a th:href="${modoAdmin} ? @{/admin/reservaciones} : @{/inicio}"
           class="boton boton-secundario boton-grande boton-bloque">Volver</a>
    </div>
</div>

<th:block th:replace="~{fragments/base :: sidebar('inicio')}"></th:block>
<footer th:replace="~{fragments/base :: footer}"></footer>

</body>
</html>
