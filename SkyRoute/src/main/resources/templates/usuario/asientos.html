<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/base :: head('Selección de asientos')}"></head>

<body>

<section class="hero hero-con-resumen">
    <th:block th:with="urlRegresar=${vuelo != null} ? @{/reservar(vueloId=${vuelo.id})} : @{/vuelos}">
        <header th:replace="~{fragments/base :: header('inicio')}"></header>
    </th:block>

    <div class="hero-contenido">
        <h1 class="hero-titulo">Selección de asientos</h1>
        <p class="hero-subtitulo"
           th:text="'Selecciona ' + ${cantidadPasajeros != null ? cantidadPasajeros : 1} + (${cantidadPasajeros != null and cantidadPasajeros > 1 ? ' asientos' : ' asiento'})">
            Selecciona 1 asiento
        </p>
    </div>
</section>

<main>
    <form class="contenedor contenedor-estrecho formulario-reserva" th:action="@{/pago}" method="POST" id="form-asientos">
        <div class="mapa-asientos">
            <div class="mapa-asientos-cuadricula"
                 th:with="totalFilas=${vuelo != null and vuelo.avion != null and vuelo.avion.asientos != null and vuelo.avion.asientos >= 12 ? (vuelo.avion.asientos / 6) : 12}">

                <span class="etiqueta-salida">Salida</span>
                <span></span>
                <span class="etiqueta-salida">Salida</span>
                <span class="letra-asiento">A</span>
                <span class="letra-asiento">B</span>
                <span class="letra-asiento">C</span>
                <span></span>
                <span class="letra-asiento">D</span>
                <span class="letra-asiento">E</span>
                <span class="letra-asiento">F</span>

                <th:block th:each="col : ${ {'A', 'B', 'C'} }">
                    <th:block th:with="cod=${col + '1'}, ocupado=${asientosOcupados != null and #lists.contains(asientosOcupados, cod)}">
                        <label class="asiento" th:classappend="${ocupado} ? 'asiento-ocupado'">
                            <input type="checkbox" name="asiento" th:value="${cod}" class="selector-oculto" th:disabled="${ocupado}">
                            <th:block th:if="${ocupado}">x</th:block>
                        </label>
                    </th:block>
                </th:block>
                <span class="numero-fila">1</span>
                <th:block th:each="col : ${ {'D', 'E', 'F'} }">
                    <th:block th:with="cod=${col + '1'}, ocupado=${asientosOcupados != null and #lists.contains(asientosOcupados, cod)}">
                        <label class="asiento" th:classappend="${ocupado} ? 'asiento-ocupado'">
                            <input type="checkbox" name="asiento" th:value="${cod}" class="selector-oculto" th:disabled="${ocupado}">
                            <th:block th:if="${ocupado}">x</th:block>
                        </label>
                    </th:block>
                </th:block>

                <span class="etiqueta-salida-rapida">Salida rápida</span>
                <span></span>
                <span class="etiqueta-salida-rapida">Salida rápida</span>

                <th:block th:each="fila : ${#numbers.sequence(2, totalFilas)}">
                    <th:block th:each="col : ${ {'A', 'B', 'C'} }">
                        <th:block th:with="cod=${col + fila}, ocupado=${asientosOcupados != null and #lists.contains(asientosOcupados, cod)}">
                            <label class="asiento" th:classappend="${ocupado} ? 'asiento-ocupado'">
                                <input type="checkbox" name="asiento" th:value="${cod}" class="selector-oculto" th:disabled="${ocupado}">
                                <th:block th:if="${ocupado}">x</th:block>
                            </label>
                        </th:block>
                    </th:block>

                    <span class="numero-fila" th:text="${fila}">2</span>

                    <th:block th:each="col : ${ {'D', 'E', 'F'} }">
                        <th:block th:with="cod=${col + fila}, ocupado=${asientosOcupados != null and #lists.contains(asientosOcupados, cod)}">
                            <label class="asiento" th:classappend="${ocupado} ? 'asiento-ocupado'">
                                <input type="checkbox" name="asiento" th:value="${cod}" class="selector-oculto" th:disabled="${ocupado}">
                                <th:block th:if="${ocupado}">x</th:block>
                            </label>
                        </th:block>
                    </th:block>
                </th:block>

            </div>
        </div>

        <button type="submit" class="boton boton-secundario boton-grande boton-bloque">Siguiente</button>
    </form>
</main>

<th:block th:replace="~{fragments/base :: sidebar('inicio')}"></th:block>
<footer th:replace="~{fragments/base :: footer}"></footer>

<script th:inline="javascript">
    const maxAsientos = /*[[${cantidadPasajeros != null ? cantidadPasajeros : 1}]]*/ 1;
    const checkboxesAsientos = document.querySelectorAll('input[name="asiento"]');

    checkboxesAsientos.forEach(cb => {
        cb.addEventListener('change', function () {
            const seleccionados = Array.from(checkboxesAsientos).filter(item => item.checked);

            if (maxAsientos === 1 && this.checked) {
                checkboxesAsientos.forEach(otro => {
                    if (otro !== this) otro.checked = false;
                });
            } else if (seleccionados.length > maxAsientos) {
                this.checked = false;
                alert('Solo puedes seleccionar ' + maxAsientos + ' asiento(s) para esta reservación.');
            }
        });
    });

    document.getElementById('form-asientos').addEventListener('submit', function (e) {
        const seleccionados = Array.from(checkboxesAsientos).filter(cb => cb.checked);
        if (seleccionados.length !== maxAsientos) {
            e.preventDefault();
            alert('Por favor selecciona ' + maxAsientos + ' asiento(s) antes de continuar.');
        }
    });
</script>

</body>
</html>
