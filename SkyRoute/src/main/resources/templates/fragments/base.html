<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<!-- FRAGMENTO DEL HEAD -->
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SkyRoute - Encuentra y reserva vuelos de manera fácil y segura.">
    <title th:text="${titulo} + ' | SkyRoute'">SkyRoute</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body>

<!-- FRAGMENTO DEL MENÚ SUPERIOR -->
<header class="encabezado-usuario" th:fragment="header(paginaActiva)">
    <div class="encabezado-izquierda">
        <a th:if="${urlRegresar != null}" th:href="${urlRegresar}" class="boton-regresar solo-movil">
            <img th:src="@{/imgs/iconos/regresar.svg}" alt="" class="icono icono-blanco">
        </a>
        <a th:href="@{/inicio}" class="marca">
            <img th:src="@{/imgs/iconos/avion.svg}" alt="" class="marca-icono icono-blanco">
            SKYROUTE
        </a>
    </div>

    <nav class="navegacion-principal">
        <ul>
            <li>
                <a th:href="@{/inicio}" class="navegacion-enlace"
                   th:classappend="${paginaActiva == 'inicio'} ? 'activo'">Inicio</a>
            </li>
            <li>
                <a th:href="@{/mis-reservas}" class="navegacion-enlace"
                   th:classappend="${paginaActiva == 'reservas'} ? 'activo'">Mis Reservas</a>
            </li>
            <li>
                <a th:href="@{/contacto}" class="navegacion-enlace"
                   th:classappend="${paginaActiva == 'contacto'} ? 'activo'">Contacto</a>
            </li>
            <li class="navegacion-usuario">
                    <span th:text="${#authentication != null and #authentication.name != 'anonymousUser' ? #authentication.name : 'Invitado'}">
                        Usuario
                    </span>
                <img th:src="@{/imgs/iconos/usuario.svg}" alt="" class="icono icono-blanco">
            </li>
            <li>
                <a th:href="@{/logout}" class="navegacion-enlace">Salir</a>
            </li>
        </ul>
    </nav>

    <label for="menu-abierto" class="boton-menu">
        <img th:src="@{/imgs/iconos/menu.svg}" alt="" class="icono icono-grande icono-blanco">
    </label>
</header>

<!-- FRAGMENTO DEL MENÚ LATERAL (MÓVIL) -->
<th:block th:fragment="sidebar(paginaActiva)">
    <input type="checkbox" id="menu-abierto" class="selector-oculto interruptor-menu">
    <div class="menu-lateral-contenedor">
        <label for="menu-abierto" class="capa-oscura"></label>
        <aside class="menu-lateral">
            <div class="menu-lateral-cabecera">
                <h2 class="menu-lateral-titulo">Menu</h2>
                <label for="menu-abierto" class="boton-cerrar">
                    <img th:src="@{/imgs/iconos/cerrar.svg}" alt="" class="icono icono-blanco">
                </label>
            </div>
            <ul class="menu-lateral-lista">
                <li class="menu-lateral-enlace">
                    <img th:src="@{/imgs/iconos/usuario.svg}" alt="" class="icono icono-blanco">
                    <span th:text="${#authentication != null and #authentication.name != 'anonymousUser' ? #authentication.name : 'Invitado'}">
                            Usuario
                        </span>
                </li>
                <li>
                    <a th:href="@{/inicio}" class="menu-lateral-enlace"
                       th:classappend="${paginaActiva == 'inicio'} ? 'activo'">
                        <img th:src="${paginaActiva == 'inicio'} ? @{/imgs/iconos/avion_amarillo.svg} : @{/imgs/iconos/avion.svg}"
                             alt="" class="icono"
                             th:classappend="${paginaActiva != 'inicio'} ? 'icono-blanco'">
                        Inicio
                    </a>
                </li>
                <li>
                    <a th:href="@{/mis-reservas}" class="menu-lateral-enlace"
                       th:classappend="${paginaActiva == 'reservas'} ? 'activo'">
                        <img th:src="${paginaActiva == 'reservas'} ? @{/imgs/iconos/boleto_amarillo.svg} : @{/imgs/iconos/boleto.svg}"
                             alt="" class="icono"
                             th:classappend="${paginaActiva != 'reservas'} ? 'icono-blanco'">
                        Mis Reservas
                    </a>
                </li>
                <li>
                    <a th:href="@{/contacto}" class="menu-lateral-enlace"
                       th:classappend="${paginaActiva == 'contacto'} ? 'activo'">
                        <img th:src="${paginaActiva == 'contacto'} ? @{/imgs/iconos/audifonos_amarillo.svg} : @{/imgs/iconos/audifonos.svg}"
                             alt="" class="icono"
                             th:classappend="${paginaActiva != 'contacto'} ? 'icono-blanco'">
                        Contacto
                    </a>
                </li>
                <li>
                    <a th:href="@{/logout}" class="menu-lateral-enlace">
                        <img th:src="@{/imgs/iconos/cerrar.svg}" alt="" class="icono icono-blanco">
                        Cerrar sesión
                    </a>
                </li>
            </ul>
        </aside>
    </div>
</th:block>

<!-- FRAGMENTO DEL FOOTER -->
<footer class="pie-pagina" th:fragment="footer">
    <div class="contenedor">
        <p>&copy; 2026 SkyRoute. Todos los derechos reservados.</p>
    </div>
</footer>

</body>
</html>
